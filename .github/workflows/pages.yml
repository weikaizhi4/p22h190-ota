name: Publish OTA page

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Generate site and OTA manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate.py --repository "$GITHUB_REPOSITORY" --output _site
      - name: Verify generated site
        run: |
          set -eu
          echo "--- generated files ---"
          find _site -type f | sort
          test -s _site/index.html
          test -s _site/style.css
          test -s "_site/updates/P22H190/UNOFFICIAL.json"
          test -s "_site/updates/P22H190/UNOFFICIAL-gapps.json"
          echo "--- vanilla feed ---"
          cat "_site/updates/P22H190/UNOFFICIAL.json"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
